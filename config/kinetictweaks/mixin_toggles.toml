# [数据包加载]
# [Datapack Loader]

# 数据包加载核心逻辑：
# 1. 动态排序：拦截数据包重组过程，强制将从 config 目录加载的数据包置于最高优先级，解决配置覆盖无效的问题。
# 2. 自定义加载源：支持模组自定义的数据包提供者参与排序逻辑，提升兼容性。
# Core datapack loading logic:
# 1. Dynamic Sorting: Intercepts the pack rebuilding process to force-place packs loaded from the 'config' directory at the highest priority.
# 2. Custom Sources: Enables custom pack providers to participate in the sorting logic for better compatibility.
datapack.DatapackServerMixins = true

# 数据包加载界面优化：
# 1. 拦截自动重载：当在资源包/数据包界面点击“完成”或按 ESC 退出时，拦截自动触发的完整资源重载流程，避免漫长的等待。
# 2. 交互引导：拦截后在屏幕下方显示 3 秒 I18N 提示文字，告知玩家需通过 F3+T 或重启游戏来手动生效，提高操作流畅度。
# 3. 错误诊断渲染：在数据包加载失败界面直接显示导致错误的 ID，引导查看日志，省去盲目排查的麻烦。
# Datapack loading UI optimizations:
# 1. Intercept Auto-Reload: Blocks the time-consuming resource reload process triggered by exiting the pack selection screen via "Done" or ESC.
# 2. Interaction Guide: Displays a 3s I18N prompt at the bottom after interception, informing users to use F3+T or restart to apply changes.
# 3. Failure Diagnosis: Displays problematic Pack IDs directly on the load failure screen to simplify troubleshooting.
datapack.DatapackClientMixins = true

# [飞行与移动控制]
# [Flight & Movement Control]

# 服务端飞行核心：
# 1. 飞行守门员：防止第三方模组或网络波动意外关闭玩家飞行姿态，解决掉落问题。
# 2. 跨维度恢复：确保玩家在跨维度、死亡重生或切换游戏模式后仍能继承飞行状态。
# 3. 拦截校验：拦截服务端对创造模式穿墙(No-Clip)的非法移动拉回。
# 4. 速度限制移除：彻底禁用原版服务端对行走、鞘翅飞行、载具移动的 256/300 码速度限制校验。
# 5. 实体尺寸干涉：允许在启用穿墙时动态修改玩家碰撞箱和眼高。
