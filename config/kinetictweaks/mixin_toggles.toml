# 交互: 拦截虚拟指令数据包 (/_ktcb)，触发 KubeJS 闭包回调。
# Interaction: Intercepts virtual command packets (/_ktcb) to trigger KubeJS callbacks.
minecraft.ChatPacketInterceptorMixin = true

# [标签页管理]
# [Creative Tab Management]

# 创造模式标签页内容过滤。
# Creative tab content filtering.
tabs.CreativeModeTabMixin = true

# [刷怪逻辑优化]
# [Spawner & Spawning Tweaks]

# 刷怪笼增强：实现生成计数、自毁或超长冷却。
# Spawner Enhancements: Implements spawn counting, self-destruction, or long cooldowns.
spawn.BaseSpawnerMixin = true

# 自然生成拦截与倍率系统：
# 1. 生成倍率调节：在原版生成循环中注入拦截逻辑，支持按概率减少(0.5x)或通过递归补偿增加(3.0x)生物生成尝试。
# 2. 性能优化：在降低倍率时，从 HEAD 处直接跳过后续昂贵的生成计算，显著降低 MSPT。
# Natural Spawn Interception & Rate System:
# 1. Rate Adjustment: Injects interception logic into the vanilla spawn loop to support probability-based decrease or recursive increase of spawn attempts.
# 2. Performance: Direct skip of expensive spawn calculations at the HEAD for lower rates, saving MSPT.
spawn.NaturalSpawnerMixin = true

# [信标优化]
# [Beacon Tweaks]

# 信标功能增强：提供信标等级变动监听及相关底层访问。
# Beacon Tweaks: Provides level change events and field access.
beacon.BeaconMixins = true

# [模组兼容性]
# [Mod Compatibility]

# [自然指南针] 注入 TPD 权限系统与 UI 解锁。
# [Nature's Compass] Injects TPD auth and UI unlocking.
mods.NaturesCompassMixins = true

# [探索者指南针] 注入 TPD 权限系统与 UI 解锁。
# [Explorer's Compass] Injects TPD auth and UI unlocking.
mods.ExplorersCompassMixins = true

# [默认配置]
# [Default Options]

# 默认配置管理：支持加载默认按键/设置覆盖，并强制锁定自定义默认值防止冲突。
# Default Options: Handles default settings restoration and custom key defaults.
defaultoptions.DefaultOptionsMixins = true

# [实体状态重置]
# [Entity Status Reset]

# 拦截图腾触发，用于检测玩家免死以重置 Boss 状态。
# Intercepts totem triggers to detect player death prevention and reset Boss states.
entityrese.LivingEntityMixin = true
