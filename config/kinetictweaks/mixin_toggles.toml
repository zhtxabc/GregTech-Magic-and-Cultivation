# [传送系统]
# [Teleportation System]

# 传送系统授权与逻辑增强：
# 1. 权限分级：支持自由模式(FREE)和授权模式(AUTHORIZED)。在授权模式下，普通玩家无法随意使用 /tp。
# 2. 多样化授权：支持按“次数”授权或按“限时无限次”授权，适合作为服务器奖励或商品。
# 3. 管理员豁免：可配置管理员(OP Level 2)是否需要消耗授权，高权管理员(Level 3+)始终豁免。
# 4. 安全保护：默认禁止玩家通过 /tp 指令传送其他玩家，仅允许传送自己，防止恶意骚扰。
# 5. 存档持久化：授权数据直接保存在玩家 NBT 中，跨维度、死亡重生或退出重连均不会丢失。
# 6. 自定义提示：支持配置传送失败时的自定义提示语（支持颜色代码和 {player} 占位符）。
# Teleportation Authorization and Logic Enhancements:
# 1. Mode Control: Supports FREE and AUTHORIZED modes. In authorized mode, normal players cannot use /tp freely.
# 2. Flexible Auth: Supports 'Count-based' or 'Time-limited' authorizations, ideal for server rewards.
# 3. Admin Bypass: Configurable bypass for OP Level 2; super admins (Level 3+) always bypass.
# 4. Safety First: Restricts players to only teleporting themselves by default, preventing harassment.
# 5. Persistence: Auth data is stored in player NBT, persisting through dimensions, death, or relog.
# 6. Custom Feedback: Customizable denial messages with color code and {player} placeholder support.
tpd.TeleportSystemMixins = true

# [性能与实体优化]
# [Optimization & Entity Tweaks]

