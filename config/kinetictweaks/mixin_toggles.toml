# KineticTweaks 核心注入机制控制面板
# KineticTweaks Mixin Toggles
# 格式: Module.ClassName = true/false
# Format: Module.ClassName = true/false
# 注意: 修改此文件后必须重启游戏才能生效
# Notice: Restart required after changes

# [TPS 性能监控]
# [TPS Performance Monitoring]

# 注入 TPS 追踪器，记录每个 Tick 的耗时数据。
