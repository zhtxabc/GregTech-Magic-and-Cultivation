
#世界初始化设置 (每次开服时执行)
#World Initialization Settings
[world_init]
	# 是否启用初始化逻辑
	#Enable initialization logic.
	enable = true
	# 首次加载世界时执行的指令列表 (不需要加斜杠 /, 直接输入指令)
	#示例:
	#["say World Initialized!", "gamerule keepInventory true"]
	#
	#List of commands to execute on first load. (Do not add slash /, just type the command)
	#Examples:
	#["say World Initialized!", "gamerule keepInventory true"]
	commands = []

